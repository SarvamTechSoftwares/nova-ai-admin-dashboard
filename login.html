<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AI Admin Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="login-body">
    <div class="glass-panel login-card">
      <div class="logo" style="justify-content: center; margin-bottom: 30px">
        <i class="fa-solid fa-brain"></i>
        <span>NovaAI Admin</span>
      </div>

      <h2 style="margin-bottom: 10px">Welcome Back</h2>
      <p style="color: var(--text-secondary); margin-bottom: 30px">
        Enter your credentials to access the nexus.
      </p>

      <form action="dashboard.html">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input
            type="email"
            class="form-input"
            placeholder="admin@novaai.com"
            value="admin@nova.ai"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input
            type="password"
            class="form-input"
            placeholder="••••••••"
            value="password"
          />
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: var(--text-secondary);
          "
        >
          <label><input type="checkbox" /> Remember me</label>
          <a href="#" style="color: var(--accent-primary)">Forgot password?</a>
        </div>

        <button
          type="submit"
          class="btn btn-primary"
          style="width: 100%; justify-content: center"
        >
          Sign In <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </body>
</html>
